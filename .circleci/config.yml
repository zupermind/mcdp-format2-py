            printf 'export CARGO_REGISTRIES_ZUPER_REGISTRY_TOKEN=%q\n' "${CARGO_REGISTRY_TOKEN:?}"
            printf 'export CARGO_REGISTRIES_ZUPER_REGISTRY_CREDENTIAL_PROVIDER=cargo:token\n'
          } >> "${BASH_ENV}"
    - run:
        name: Report tool versions
