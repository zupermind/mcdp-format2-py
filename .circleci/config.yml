            printf 'export CARGO_REGISTRIES_ZUPER_REGISTRY_CREDENTIAL_PROVIDER=cargo:token\n'
          } >> "${BASH_ENV}"
    - run:
        name: Report tool versions
        command: |
          saferun --version
          zuper-rs-lint --version
    - run:
        name: Resolve pull-request base context
        command: zuper-rs-ci-tools resolve-pr-base
    - run:
        name: Generate pull-request readiness lint reports
        command: saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/lint-pr-ready --heartbeat 30s --stats-interval 5s -- zuper-rs-lint run --suite pull-request --json-report "${ZUPER_RS_LINT_OUTPUT_DIR}/report.json" --html-report "${ZUPER_RS_LINT_OUTPUT_DIR}/report.html" --junit-report "${ZUPER_RS_LINT_TEST_RESULTS_DIR}/zuper-rs-lint.xml"
    - store_test_results:
