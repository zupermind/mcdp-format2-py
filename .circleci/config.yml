version: 2.1
parameters:
  context_name:
    type: string
    default: z7-stage
workflows:
  version: 2
  test:
    jobs:
    - test-313-src:
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
        name: test-py313-src-run-1-of-1
        logical_job: test-313-src
    - lint:
        context: << pipeline.git.branch starts-with "z7-prod" and "z7-prod" or pipeline.git.branch starts-with "z7-stage" and "z7-stage" or pipeline.parameters.context_name >>
        filters:
          tags:
            ignore: /.*/
  lint-pr-ready:
    jobs:
    - lint-pr-ready:
        context: << pipeline.git.branch starts-with "z7-prod" and "z7-prod" or pipeline.git.branch starts-with "z7-stage" and "z7-stage" or pipeline.parameters.context_name >>
        filters:
          tags:
            ignore: /.*/
  fresh:
    jobs:
    - lint-fresh:
        context: << pipeline.git.branch starts-with "z7-prod" and "z7-prod" or pipeline.git.branch starts-with "z7-stage" and "z7-stage" or pipeline.parameters.context_name >>
        filters:
          branches:
            ignore:
            - /^z7-(stage|prod)-v[0-9]+$/
          tags:
            ignore: /.*/
jobs:
  test-313-src:
    environment:
      COLUMNS: '160'
      PATH: /opt/ci-venv/bin:/root/.local/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      CONTEXT_NAME: << pipeline.parameters.context_name >>
      DEPS_INSTALL_TIMEOUT: '10m'
      COVER_PACKAGES: mcdp_format2_py
      TEST_PACKAGES: mcdp_format2_py
      ZUPER_CIRCLE_LOGICAL_JOB: << parameters.logical_job >>
    docker:
    - image: docker.io/zupermind/zuper-ci-3.13:z7-stage-v1@sha256:3841c333a36cb9dea51d07dfe146e55b02dd20f1bf4d2d73424ddab43ac5e168
      auth:
        username: $DOCKER_IO_READONLY_USERNAME
        password: $DOCKER_IO_READONLY_TOKEN
    working_directory: ~/repo
    steps:
    - checkout
    - run:
        name: Report tool versions
        command: |
          export PIP_INDEX_URL="${PIP_INDEX_URL_SRC}"
          saferun --version
          zuper-rs-lint --version
          python3 --version
          python3 -m pip --version
    - run:
        name: Avoid hosts unknown for Github
        command: |
          mkdir -p ~/.ssh
          echo -e "Host github.com\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
    - run:
        name: Build statistics
        command: "set -x \nmkdir -p build-stats\n# image_name=`cat /.circleci-runner-config.json | jq -r .Job.docker[0].Image | envsubst`\n# registry_to_login=`echo ${image_name} | cut -d'/' -f1`\n# regctl registry login -u \"${DOCKER_USERNAME}\" -p \"${DOCKER_PASSWORD}\" \"${registry_to_login}\"\n\nlogical_job=${ZUPER_CIRCLE_LOGICAL_JOB:-${CIRCLE_JOB}}\n# regctl manifest get --format raw-body \"${image_name}\" > build-stats/jobs/${logical_job}/image-manifest.json\n# regctl image digest \"${image_name}\" > build-stats/jobs/${logical_job}/image-digest.txt\n# echo ${image_name} > build-stats/jobs/${logical_job}/image-name.txt\n\nmkdir -p build-stats/envs\nmkdir -p build-stats/jobs/${logical_job}\nmkdir -p build-stats/jobs/${logical_job}/envs\necho -n \"${Z_REQS_SHA:-not-present}\"     > build-stats/jobs/${logical_job}/envs/Z_REQS_SHA\necho -n \"${IMAGE_VCS_SHA:-not-present}\"  > build-stats/jobs/${logical_job}/envs/IMAGE_VCS_SHA\necho -n \"${IMAGE_NAME:-not-present}\"     > build-stats/jobs/${logical_job}/envs/IMAGE_NAME\necho -n \"${CONTEXT_NAME:-not-present}\"   > build-stats/jobs/${logical_job}/envs/CONTEXT_NAME\necho -n \"${PYTHONOPTIMIZE:-not-present}\" > build-stats/jobs/${logical_job}/envs/PYTHONOPTIMIZE\n"
    - store_artifacts:
        path: build-stats
        destination: build-stats
    - run:
        name: Configure the Python package index
        command: |
          printf 'export UV_DEFAULT_INDEX=%q\n' "${PIP_INDEX_URL_SRC:?}" >> "${BASH_ENV}"
    - run:
        name: Report lock tool versions
        command: |
          uv --version
          zuper-python-utils --version
    - run:
        name: Check the Python dependency lock
        command: saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/check-lockfile --heartbeat 30s --stats-interval 5s -- zuper-python-utils check-lockfile
    - run:
        name: Install the locked dependencies
        command: |
          uv venv --python python3 --no-python-downloads .ci-venv
          saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/install-locked-deps --heartbeat 30s --stats-interval 5s -- timeout ${DEPS_INSTALL_TIMEOUT} zuper-python-utils install-lockfile --python .ci-venv/bin/python
          printf 'export VIRTUAL_ENV=%q\n' "${PWD}/.ci-venv" >> "${BASH_ENV}"
          printf 'export PATH=%q:"${PATH}"\n' "${PWD}/.ci-venv/bin" >> "${BASH_ENV}"
    - run:
        name: Python stats
        command: |
          uv pip list --python .ci-venv/bin/python | tee build-stats/pip-list.txt
          uv pip freeze --python .ci-venv/bin/python | sort | tee build-stats/pip-freeze.txt
    - run:
        name: Install the project without dependencies
        command: |
          saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/install-project --heartbeat 30s --stats-interval 5s -- uv pip install --python .ci-venv/bin/python --no-deps --no-build-isolation --no-index --editable .
    - store_artifacts:
        path: build-stats
        destination: build-stats
    - run:
        name: Make docs
        command: |
          FILE=src/conf.py
          mkdir -p out/docs
          if test -f "$FILE"; then
              saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/docs --heartbeat 30s --stats-interval 5s -- sphinx-build src out/docs
          fi
    - store_artifacts:
        path: out/docs
        destination: docs
    - run:
        background: true
        name: services
        command: |
          TARGET=services
          if make -n $TARGET ; then
              make $TARGET
          else
              echo "Target $TARGET not defined"
          fi
    - run:
        name: pre-circle-tests
        command: |
          TARGET=pre-circle-tests
          if make -n $TARGET ; then
              saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/pre-circle-tests --heartbeat 30s --stats-interval 5s -- make pre-circle-tests
          else
              echo "Target $TARGET not defined"
          fi
    - run:
        name: mcdp_format2_py
        command: |
          export PIP_INDEX_URL="${PIP_INDEX_URL_SRC}"
          test_list=.circleci/mcdp_format2_py.tests
          if [ ! -f "$test_list" ]; then
            echo "$test_list is absent; no tests selected"
            exit 0
          fi
          set -euxo pipefail
          TEST_MODULES=$(split-tests <.circleci/mcdp_format2_py.tests)
          echo "TEST_MODULES=[$TEST_MODULES]"
          if [ -z "$TEST_MODULES" ]; then
            echo "$TEST_MODULES is empty"
            exit 0
          else
            echo "$TEST_MODULES is NOT empty"
          fi
          mkdir -p out/test-results
          : > out/test-results/tests-selected
          xunit_output=$PWD/out/test-results/nose-${CIRCLE_NODE_INDEX}-mcdp_format2_py-xunit.xml
          saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/test-mcdp_format2_py --heartbeat 30s --stats-interval 5s -- timeout 30m nose2 --with-coverage --plugin nose2.plugins.junitxml --junit-xml --junit-xml-path ${xunit_output} $TEST_MODULES
    - run:
        name: post-circle-tests
        when: always
        command: |
          TARGET=post-circle-tests
          if make -n $TARGET ; then
              saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/post-circle-tests --heartbeat 30s --stats-interval 5s -- make post-circle-tests
          else
              echo "Target $TARGET not defined"
          fi
    - store_test_results:
        path: out/test-results
    - run:
        name: Coverage report
        command: |
          set -eu
          if [ ! -f out/test-results/tests-selected ]; then
            echo "No tests selected; no coverage to report or upload"
            exit 0
          fi
          for data in .coverage.*; do
            if [ -f "$data" ]; then
              saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/coverage-combine --heartbeat 30s --stats-interval 5s -- coverage combine --append
              break
            fi
          done
          saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/coverage-html --heartbeat 30s --stats-interval 5s -- coverage html -d out/coverage/${CIRCLE_NODE_INDEX}
          saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/coverage-xml --heartbeat 30s --stats-interval 5s -- coverage xml
    - store_artifacts:
        path: out/coverage
        destination: coverage
    - store_artifacts:
        path: out/tests
        destination: tests
    - store_artifacts:
        path: out/saferun
        destination: saferun
    - run:
        name: CodeCov
        command: |
          if [ ! -f out/test-results/tests-selected ]; then
            echo "No tests selected; no coverage to report or upload"
            exit 0
          fi
          saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/codecov-upload --heartbeat 30s --stats-interval 5s -- timeout 1m codecovcli upload-coverage --fail-on-error --disable-search --file coverage.xml
    resource_class: zuper-ci-ns/c1m6
    parameters:
      logical_job:
        type: string
        default: test-313-src
  lint:
    environment:
      ZUPER_RS_LINT_OUTPUT_DIR: out/zuper-rs-lint
      ZUPER_RS_LINT_TEST_RESULTS_DIR: out/test-results
    docker:
    - image: docker.io/zupermind/zuper-rs-ci-checks:z7-stage-v1@sha256:2249832e47019b1d314ce0fb058a855c0df77f2daf80265875bae1bacd144532
      auth:
        username: $DOCKER_IO_READONLY_USERNAME
        password: $DOCKER_IO_READONLY_TOKEN
    resource_class: small
    steps:
