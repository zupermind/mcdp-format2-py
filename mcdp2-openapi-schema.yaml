              symbol: "m_i"
              description: |
                Maps to be composed.
          labels:
            type: "array"
            items:
              type: "string"
            description: |
              A list of labels for the maps
          type:
            type: "string"
            const: "U1_C_CodSum"
            enum:
            - "U1_C_CodSum"
            default: "U1_C_CodSum"
        type: "object"
        title: "Co-domain sum combination"
        x-latex-schema:
          group: "20_compositions"
          description: |
            Given two maps $f: A \to B$ and $g: A \to C$, the codomain sum of these maps is a map that combines the codomains of both maps:
            %
            \begin{equation}
                SELF(f, g) : A \to P\_C\_Sum(B, C)
            \end{equation}
            %
            It is defined as follows:
            \begin{equation}
                x \mapsto  \{ \text{in}_1 (b) \mid b \in f(x) \}  \cup \{ \text{in}_2 (c) \mid c \in g(x) \}
            \end{equation}
        required:
        - "ms"
        - "type"
        x-mcdp-ul1:
          params:
          - "ms"
          functors:
            kdom: "P_F_C_Intersection(@(ms))"
            kcod: "P_C_Sum(@(ms))"
    U1_C_CodSumSmash:
