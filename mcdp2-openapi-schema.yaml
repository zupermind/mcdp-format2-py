      allOf:
      - $ref: "#/components/schemas/DP"
      - properties:
          f_r:
            $ref: "#/components/schemas/SU1Map"
            description: "The function that returns minimal resources needed to satisfy the requirements."
          f_b_r:
            description: "The function that returns the maximum functionality given the budget of resources as well as the blueprint."
            $ref: "#/components/schemas/SUMap"
          f_i_r:
            description: "The function that returns the maximum functionality given the budget of resources as well as the implementation."
            $ref: "#/components/schemas/SUMap"
          r_f:
            description: "The function that returns the maximum functionality given the budget of requirements."
            $ref: "#/components/schemas/SL1Map"
          r_b_f:
            description: "The function that returns the maximum functionality given the budget of resources as well as the blueprint."
            $ref: "#/components/schemas/SLMap"
          r_i_f:
            description: "The function that returns the maximum functionality given the budget of resources as well as the implementation."
            $ref: "#/components/schemas/SLMap"
          i_b:
            description: "The function that maps implementations to blueprints."
            $ref: "#/components/schemas/MonotoneMap"
          i_codfeas:
