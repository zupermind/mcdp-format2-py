              The design problem that is being traced.
          type:
            type: "string"
            const: "DP_C_Trace"
            enum:
            - "DP_C_Trace"
            default: "DP_C_Trace"
        type: "object"
        title: "Trace of a design problem."
        x-latex-schema:
          group: "g40_composition_single"
        required:
        - "dp"
        - "type"
        x-mcdp-dp:
          params:
          - "dp"
          functors:
            I: "@(*)"
            B: "@(*)"
            F: "@(*)[0]"
            R: "@(*)[0]"
            prov: "M_C_Series([@(*), M_TakeIndex(0, 2)])"
            req: "M_C_Series([@(*), M_TakeIndex(0, 2)])"
            f_r: "SU1_C_Trace(@(*))"
            f_b_r: "SU_C_Trace(@(*))"
            f_i_r: "SU_C_Trace(@(*))"
            r_f: "SL1_C_Trace(@(*))"
            r_b_f: "SL_C_Trace(@(*))"
            r_i_f: "SL_C_Trace(@(*))"
            i_b: "@(*)"
            i_codfeas: "M_C_Series([M_C_Product([prov(*), req(*)]), M_Leq])"
            i_availability: "@(*)"
