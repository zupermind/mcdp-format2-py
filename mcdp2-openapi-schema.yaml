          type:
            type: "string"
            const: "DP_Compiled"
            enum:
            - "DP_Compiled"
            default: "DP_Compiled"
        type: "object"
        title: "An \"opaque\" DP defined explicitly by its interface."
        x-latex-schema:
          group: "g90_special"
        required:
        - "f_b_r"
        - "f_i_r"
        - "f_r"
        - "i_availability"
        - "i_b"
        - "i_codfeas"
        - "prov"
        - "r_b_f"
        - "r_f"
        - "r_i_f"
        - "req"
        - "type"
    DP_F_Leq_All_Constants:
      allOf:
      - $ref: "#/components/schemas/DP"
      - properties:
          constants:
            type: "array"
            items: {}
            minItems: 1
            description: |
              A list of constants c₁, ..., c_n.
            x-latex-property:
              symbol: "c_i"
              description: |
                A list of constants $c_1, \dots, c_n$.
          type:
            type: "string"
            const: "DP_F_Leq_All_Constants"
            enum:
            - "DP_F_Leq_All_Constants"
            default: "DP_F_Leq_All_Constants"
        type: "object"
        title: "Compare a functionality to a set of constants"
        x-latex-schema:
          order: 150
          group: "g60_non_lattices"
          description: |
            The relation is given by:
            %
            \begin{equation*}
            (\fun \leq c_1)
                \wedgeDots (\fun \leq c_n)
            \end{equation*}


            Note: This extended form is needed when the constants are not a lattice.
            In the case of a lattice, the relation would be given by:
            %
            \begin{equation*}
                \fun \leq \bigwedge_i c_i
            \end{equation*}
            %
            and could be realized using DP\_GenericConstant.
        required:
        - "constants"
        - "type"
