      allOf:
      - $ref: "#/components/schemas/L1Map"
      - properties:
          ms:
            type: "array"
            items:
              $ref: "#/components/schemas/L1Map"
            x-latex-property:
              symbol: "\\lmor_\\idx"
              description: |
                Maps to be composed.
          labels:
            type: "array"
            items:
              type: "string"
            description: |
              A list of labels for the maps
