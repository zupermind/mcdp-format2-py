      - $ref: "#/components/schemas/DP"
      - properties:
          dps:
            description: "A list of design problems (DPs) to be composed."
            type: "array"
            items:
              $ref: "#/components/schemas/DP"
          labels:
            type: "array"
            items:
              type: "string"
            description: |
              A list of labels.
          type:
            type: "string"
            const: "DP_C_Series"
            enum:
            - "DP_C_Series"
            default: "DP_C_Series"
        type: "object"
        title: "Series composition of DPs."
        x-latex-schema:
          group: "g30_composition"
          description: |
            Series composition of DPs.
        required:
        - "dps"
        - "type"
        x-mcdp-dp:
          params:
          - "dps"
          functors:
            F: "F(dps[0)"
            R: "R(dps[-1])"
            I: "P_C_ProductSmash(I(dps))"
            B: "P_C_ProductSmash(B(dps))"
            prov: "M_C_Series([M_TakeRange(..), prov(dps[0]))])"
            req: "M_C_Series([M_TakeRange(..), req(dps[-1]))])"
            i_b: "M_C_ProductSmash(i_b(dps))"
            f_r: "SU1_C_Series(f_r(dps))"
            f_b_r: "SU_C_Series(f_b_r(dps))"
            f_i_r: "SU_C_Series(f_i_r(dps))"
            r_f: "SL1_C_Series(r_f(dps))"
            r_b_f: "SL_C_Series(r_b_f(dps))"
            r_i_f: "SL_C_Series(r_i_f(dps))"
    DP_C_Trace:
