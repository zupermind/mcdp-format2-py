    DP_Catalog:
      allOf:
      - $ref: "#/components/schemas/DP"
      - properties:
          options:
            description: |
              A list of options that define the design problem.
              Each option is a tuple of functionality, requirement, blueprint, and implementation.
            type: "array"
            items:
              $ref: "#/components/schemas/DP_Catalog_Options"
          type:
            type: "string"
            const: "DP_Catalog"
            enum:
            - "DP_Catalog"
            default: "DP_Catalog"
        type: "object"
        title: "A DP defined explicitly by a set of options."
        x-latex-schema:
          group: "g05_first"
          description: |
            This DP is defined explicitly by a set of options.
            Each option is a tuple of functionality, requirement, blueprint, and implementation.

            The relation is given by:
            %
            \begin{equation*}
            \bigvee_{ (f_j, r_j, b_j, i_j) \in \text{options} } \quad
               ( \fun \leq f_j) \wedge
                (r_j \leq \res)
            \end{equation*}
          order: 50
        required:
        - "options"
        - "type"
    DP_Catalog_Options:
      type: "object"
      title: "One option for the catalog"
      properties:
        f:
          description: "Functionality"
        r:
          description: "Requirement"
        b:
          description: "Blueprint"
        i:
          description: "Implementation"
      required:
      - "f"
      - "r"
      - "b"
      - "i"
      x-latex-property:
        title: "An option in the design problem"
        description: |
          An option in the design problem, where `f` is the functionality, `r` is the requirement, `b` is the blueprint, and `i` is the implementation.
