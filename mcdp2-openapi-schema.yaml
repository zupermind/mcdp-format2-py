            - "P_Finite"
            default: "P_Finite"
        type: "object"
        title: "Arbitrary finite poset"
        x-latex-schema:
          group: "10_primitive"
          description: |
            A finite poset is a set of elements with a partial order defined by a set of relations.
          examples_description:
          - |
            This is the empty poset.
          - |
            This is a poset with two elements that are not related.
          - |
            This is a poset with two elements with $a \leq b$.
          - |
            This is a pre-order with 5 elements: \texttt{a}, \texttt{b}, \texttt{c}, \texttt{a1}, and \texttt{a2}.
            The elements \texttt{a}, \texttt{a1}, \texttt{a2} are equivalent. 
            The element \texttt{a} is used as the representative of the equivalence class.
        examples:
        - kind: "Poset"
          type: "P_Finite"
          elements: []
          relations: []
          aliases: {}
        - kind: "Poset"
          type: "P_Finite"
          elements:
          - "a"
          - "b"
          relations: []
        - kind: "Poset"
          type: "P_Finite"
          elements:
          - "a"
          - "b"
          relations:
          - - "a"
            - "b"
        - kind: "Poset"
          type: "P_Finite"
          elements:
          - "a"
          - "b"
          - "c"
          relations:
          - - "a"
            - "b"
          - - "b"
            - "c"
          aliases:
            a:
            - "a1"
            - "a2"
