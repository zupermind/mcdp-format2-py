    P_F_Bounded:
      allOf:
      - $ref: "#/components/schemas/Poset"
      - properties:
          poset:
            $ref: "#/components/schemas/Poset"
            description: |
              The ambient poset.
            x-latex-property:
              color: "color-poset"
          bottom:
            x-latex-property:
              symbol: "\\BPbottom"
              description: |
                The bottom element of the subposet.
          top:
            x-latex-property:
              symbol: "\\BPtop"
              description: |
                The top element of the subposet.
          step:
            type: "string"
            x-latex-property:
              symbol: "\\BPstep"
              description: |
                The step size of the subposet.
          offset:
            x-latex-property:
              symbol: "\\BPoffset"
              description: |
                The offset
          bound_high:
            x-latex-property:
              symbol: "\\BPboundHigh"
              description: |
                An upper bound.
          bound_low:
            x-latex-property:
              symbol: "\\BPboundLow"
              description: |
                A lower bound.
          type:
            type: "string"
            const: "P_F_Bounded"
            enum:
            - "P_F_Bounded"
            default: "P_F_Bounded"
        type: "object"
        title: "A subposet that allows to sample a numeric poset."
        x-latex-schema:
          group: "60_filters"
          preamble: |
            \newcommand{\BPbottom}{\mathrm{B}} 
            \newcommand{\BPtop}{\mathrm{T}} 
            \newcommand{\BPstep}{\mathrm{S}} 
            \newcommand{\BPoffset}{\mathrm{O}}
            \newcommand{\BPboundHigh}{\mathrm{H}} 
            \newcommand{\BPboundLow}{\mathrm{L}}
          description: |
            A bounded poset is a subposet of a numeric poset that allows to discretize it.

            It is defined by 5 values that satisfy:
            \begin{equation}
                \BPbottom \leq \BPboundLow \leq \BPoffset \leq \BPboundHigh \leq \BPtop
            \end{equation}

            The subposet is defined by
            \begin{equation}
                \{\BPbottom, \BPtop\} \ \cup \ \left(
                                                   [ \BPboundLow, \BPboundHigh ] \ \cap \ % 
                                                   \{ \BPoffset + i \cdot \BPstep \mid i \in \mathbb{Z}\}
                \right)
            \end{equation}
            where $[ \BPboundLow, \BPboundHigh ]$ is the closed interval between $\BPboundLow$ and $\BPboundHigh$.
          examples_description:
          - |
            This defines the nonnegative integers.
          - |
            This defines the odd integers. The offset is $1$ and the step is $2$.
          - |
            This complex example describes the poset with the elements $\{-\infty, 0, 1.5, 3, 4.5, 6,  +\infty\}$.
        examples:
        - kind: "Poset"
          type: "P_F_Bounded"
          poset:
            kind: "Poset"
            type: "P_Decimal"
          bottom: "0"
          bound_low: "0"
          step: "1"
          offset: "0"
          bound_high: "+inf"
          top: "+inf"
        - kind: "Poset"
          type: "P_F_Bounded"
          poset:
            kind: "Poset"
            type: "P_Decimal"
          bottom: "-inf"
          bound_low: "-inf"
          step: "2"
          offset: "1"
          bound_high: "+inf"
          top: "+inf"
        - kind: "Poset"
          type: "P_F_Bounded"
          poset:
            kind: "Poset"
            type: "P_Decimal"
          bottom: "-inf"
          bound_low: "0"
          offset: "0"
          step: "1.5"
          bound_high: "6"
          top: "+inf"
        required:
        - "bottom"
        - "bound_high"
        - "bound_low"
        - "offset"
        - "poset"
        - "step"
        - "top"
        - "type"
        x-mcdp-poset:
          serialization: |
            As a ``filter'', the values of this poset are represented as in the ambient poset.
