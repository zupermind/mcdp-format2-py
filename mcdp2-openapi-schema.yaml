            default: "U1_C_DomUnion"
        type: "object"
        title: "Domain union"
        x-latex-schema:
          group: "20_compositions"
          description: |
            This is the equivalent of M\_C\_DomUnion.

            Given two maps $f: A \to B$ and $g: C \to B$, the domain union of these maps is a map that combines the domains of both maps:
            %
            \begin{equation}
                SELF(f, g) : P\_F\_C\_Union( A, C) \to B
            \end{equation}

            The value is defined as follows:
            %
            \begin{equation}
                SELF(f, g) : x \mapsto
                \begin{cases}
                    f(x) & \text{if } x \in A \\
                    g(x) & \text{if } x \in C
                \end{cases}
            \end{equation}

            Note that the order of the maps does matter.
            We use the first map whose domain contains the input.
        required:
        - "ms"
        - "type"
        x-mcdp-ul1:
          params:
          - "ms"
          functors:
            kdom: "P_F_C_Union(@(ms))"
            kcod: "P_F_C_Union(@(ms))"
