              $ref: "#/components/schemas/Range"
            description: |
              The ranges of the posets in the smash product. See also P_C_Sum
          naked:
            type: "array"
            items:
              type: "boolean"
            description: "Whether each poset is \"naked\" or not."
          type:
            type: "string"
            const: "P_C_ProductSmash"
            enum:
            - "P_C_ProductSmash"
            default: "P_C_ProductSmash"
        type: "object"
        title: "Poset smash product"
        x-latex-schema:
          group: "50_composition_multi"
          preamble: |
            \newcommand{\PProductSmash}[1]{\text{ProductSmash}(#1)}
          description: |
            This poset is the ``smash product''. 
            Its elements are concatenation of tuples of elements of the underlying posets. 

            We say that a subposet is ``naked'' if it is not of a ``smash nature'' and its elements need to be wrapped as a tuple.

            The posets that are of a smash nature are:

            \begin{itemize}
                \item Other instances of SELF
                \item Instances of P\_C\_SumSmash
                \item Instances of filters (e.g. P\_F\_Subposet or P\_C\_Units) whose underlying poset is of smash nature.    
            \end{itemize} 

            The \texttt{ranges} parameter describe what is the range in the tuple of each subposet.

            Both the \texttt{ranges} and \texttt{naked} parameters are redundant in the sense that they can be computed from the subs,
            but they are provided for convenience and to avoid recomputing them.


                
                
          examples_description:
          - |
            The empty smash product. It has exactly one element, the empty tuple.
          - |
            This is the smash product of 3 posets: booleans, a smash product of two posets, and the decimals.
            The first and the last posets are naked, while the middle one is not because it is of a smash nature.
        examples:
        - kind: "Poset"
          type: "P_C_ProductSmash"
          subs: []
          naked: []
          ranges: []
        - kind: "Poset"
          type: "P_C_ProductSmash"
          subs:
          - kind: "Poset"
            type: "P_Decimal"
          - kind: "Poset"
            type: "P_C_ProductSmash"
            subs:
            - kind: "Poset"
              type: "P_Decimal"
            - kind: "Poset"
              type: "P_Bool"
            naked:
            - true
            - true
            ranges:
            - type: "Range"
              start: 0
              stop: 1
              ntot: 2
            - type: "Range"
              start: 1
              stop: 2
              ntot: 2
          - kind: "Poset"
            type: "P_Decimal"
          naked:
          - true
          - false
          - true
          ranges:
          - type: "Range"
            start: 0
            stop: 1
            ntot: 4
          - type: "Range"
            start: 1
            stop: 3
            ntot: 4
          - type: "Range"
            start: 3
            stop: 4
            ntot: 4
        required:
        - "naked"
        - "ranges"
        - "subs"
        - "type"
        x-mcdp-poset:
          serialization_examples:
          - - value: []
              description: |
                The empty tuple
          - - value:
              - true
              - "10"
              - false
              - "20"
