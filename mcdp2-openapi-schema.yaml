      allOf:
      - $ref: "#/components/schemas/MonotoneMap"
      - properties:
          type:
            type: "string"
            const: "M_ReprUpperSet"
            enum:
            - "M_ReprUpperSet"
            default: "M_ReprUpperSet"
        type: "object"
        title: "Maps a point to the largest upper set containing its closure"
        description: "ReprUpperSet"
        x-latex-schema:
          group: "g15_poset_ops"
          description: |
            This map $m : \dom \to \cod$, with $\dom \subseteq \cod$, 
            takes a point $x$ in the domain and returns the largest upper set containing its closure.

            \begin{equation*}
                    x \mapsto \arg\min_{y \geq x} \upit y
            \end{equation*}

            If this point does not exist, the map is ``undefined''.

            Note: M\_RepresentPrincipalUpperSet\_TotalOrderBounded does the same thing but it is guaranteed to always be defined. 
          excluded: true
        required:
        - "type"
    M_RepresentPrincipalLowerSet_TotalOrderBounded:
      allOf:
      - $ref: "#/components/schemas/MonotoneMap"
      - properties:
          type:
            type: "string"
            const: "M_RepresentPrincipalLowerSet_TotalOrderBounded"
            enum:
            - "M_RepresentPrincipalLowerSet_TotalOrderBounded"
            default: "M_RepresentPrincipalLowerSet_TotalOrderBounded"
        type: "object"
        title: "Largest principal lower set in the poset."
        x-latex-schema:
          group: "g15_poset_ops"
          description: |
            This map $m : \dom \to \cod$, with $\dom, \cod$ subposets of a common ambient posets.
            takes a point $x$ in the domain and returns the largest lower set containing its down closure.
            % 
            \begin{equation}
                x \mapsto \arg\max_{y \leq x} \downit y
            \end{equation}  
            %
            The compilation process ensures that this map is constructed only when this is always well defined.

            Example: $\dom = \mathbb{R}$ and $\cod = \mathbb{N}$
        required:
        - "type"
        x-mcdp-map:
          flavor:
          functors:
            dom:
            cod:
            uinv:
            linv:
            used:
