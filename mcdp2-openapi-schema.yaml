              A list of constants c₁, ..., c_n.
            x-latex-property:
              symbol: "c_i"
              description: |
                A list of constants $c_1, \dots, c_n$.
          type:
            type: "string"
            const: "DP_F_Leq_All_R_And_Constants"
            enum:
            - "DP_F_Leq_All_R_And_Constants"
            default: "DP_F_Leq_All_R_And_Constants"
        type: "object"
        title: "Compares a functionality to a resource and a set of constants (conjunction)."
        x-latex-schema:
          order: 200
          group: "g60_non_lattices"
          description: |
            The relation is given by:
            %
            \begin{equation*}
                (\fun \leq c_1) \wedgeDots (\fun \leq c_n)  \wedge (\fun \leq \res)
            \end{equation*}
        required:
        - "constants"
        - "type"
