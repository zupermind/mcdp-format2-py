    U1_RepresentPrincipalUpperSet:
      allOf:
      - $ref: "#/components/schemas/U1Map"
      - properties:
          type:
            type: "string"
            const: "U1_RepresentPrincipalUpperSet"
            enum:
            - "U1_RepresentPrincipalUpperSet"
            default: "U1_RepresentPrincipalUpperSet"
        type: "object"
        title: "Represent a principal upper set"
        x-latex-schema:
          group: "15_poset_ops"
          description: |
            This map is defined when $\ukdom$ and $\ukcod$ are subsets of a common ambient poset $P$.

            It is defined as:
            % 
            \begin{equation}
                x \mapsto \max \{ S \in P\_C\_UpperSets(\ukcod) \mid S \ \subseteq \ \upit_P x \}
            \end{equation}

            The idea is that we want to ``represent'' the principal upper set $\upit_P x$ in terms of the codomain $\ukcod$.

            For example, consider the case 
            % 
            \begin{itemize}
                \item $\ukdom = 2\mathbb{Z}$, the even integers
                \item $\ukcod = 3\mathbb{Z}$, the multiples of 3  
            \end{itemize} 

            They are both subposets of the ambient poset $\mathbb{Z}$.
            The map would associate each even integer $x$ with the up closure of the smallest multiple of 3 greater than or equal to $x$:
            %
            \begin{align*}
                10 &\mapsto \upit 12 \\
                8 &\mapsto \upit 9 \\
                6 &\mapsto \upit 6 \\
                4 &\mapsto \upit 6 \\
                2 &\mapsto \upit 3 \\
                0 &\mapsto \upit 0 
            \end{align*}

            In general, the posets are not total orders, so the result is not necessarily a principal upper set.
        required:
        - "type"
